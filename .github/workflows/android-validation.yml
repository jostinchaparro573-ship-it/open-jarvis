name: Android validation

on:
  push:
    branches:
      - main
      - "jarvis/**"
  pull_request:
    branches:
      - main

concurrency:
  group: android-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.2"

      - name: Compile Android Kotlin sources
        run: gradle :app:compileDebugKotlin

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest

      - name: Run Android lint
        run: gradle :app:lintDebug
